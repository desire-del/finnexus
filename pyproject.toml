[project]
name = "rag-sec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Desire", email = "Desire" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "matplotlib>=3.11.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "tenacity>=9.1.4",
    "structlog>=26.1.0",
    "arize-phoenix-otel>=0.17.1",
    "opentelemetry-api>=1.44.0",
    "openinference-instrumentation-openai>=0.1.54",
    "openinference-instrumentation-langchain>=0.1.70",
    "openai>=3.3.1",
    "langchain-core>=1.6.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "tiktoken>=0.14.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.6.0",
]

[dependency-groups]
dev = [
    "edgartools>=5.43.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]



[project.scripts]
rag-sec = "rag_sec:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
